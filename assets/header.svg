<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250">
  <!--
    ============================================================
    ОСНОВНЫЕ РАЗМЕРЫ (меняйте при необходимости):
      width="680"   – ширина карточки
      height="340"  – высота карточки
      viewBox="0 0 680 340" – система координат (должна совпадать)
    ============================================================
  -->

  <defs>
    <!-- ФОНОВЫЙ ГРАДИЕНТ (радиальный) -->
    <!-- Меняйте:
           cx, cy – центр (в %)
           r       – радиус распространения
           stop offset и stop-color – цвета и их положение
    -->
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#a5b4fc"/>
      <stop offset="25%" stop-color="#c7d2fe"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="55%" stop-color="#f5f3ff"/>
      <stop offset="65%" stop-color="#ffffff"/>
    </radialGradient>
  </defs>

  <!-- ============ ФОН ============ -->
  <rect width="680" height="300" rx="20" fill="url(#bg)"/>

  <!-- ============ ДЕКОРАТИВНЫЕ ВОЛНЫ ============ -->
  <!-- Меняйте d (траекторию), stroke, stroke-width, opacity -->
  <path d="M0,60 Q170,35 340,55 Q510,75 680,45" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M0,65 Q200,45 400,60 Q560,72 680,50" stroke="#c7d2fe" stroke-width="1"   stroke-linecap="round" fill="none" opacity="0.25"/>


  <!-- ============ ДЕКОРАТИВНЫЕ ЗВЁЗДОЧКИ ============ -->
  <!-- Меняйте x, y, font-size, fill, opacity -->
  <text x="600" y="68"  font-family="serif" font-size="22" fill="#818cf8" opacity="0.6">✦</text>
  <text x="632" y="78"  font-family="serif" font-size="11" fill="#a5b4fc" opacity="0.4">✦</text>


  <!-- ============ ИМЯ ============ -->
  <!-- Меняйте текст, font-size, fill -->
  <text x="340" y="125" text-anchor="middle" font-family= 'Arial Narrow' font-size="30" font-weight="bold" fill="#312e81">Hi, I’m DiShato</text>

  <!-- ============ ДОЛЖНОСТЬ ============ -->
  <!-- Меняйте текст, font-size, fill -->
  <text x="340" y="170" text-anchor="middle" font-family="Arial Narrow" font-size="19" fill="#6366f1"> Analyst · Data Scientist · ML Engineer · Deep Learning enthusiast </text>

</svg>
