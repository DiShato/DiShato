<svg xmlns="http://www.w3.org/2000/svg" width="680" height="50" viewBox="0 0 680 50">
  <!--
    ============================================================
    ОСНОВНЫЕ РАЗМЕРЫ (меняйте при необходимости):
      width="680"   – ширина карточки
      height="50"  – высота карточки
      viewBox="0 0 680 50" – система координат (должна совпадать)
    ============================================================
  -->

  <defs>
    <!-- ЭФФЕКТ СВЕЧЕНИЯ (для надписи TECH STACK) -->
    <!-- Меняйте stdDeviation (сила размытия) -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="0" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============ РАЗДЕЛИТЕЛЬНАЯ ЛИНИЯ ============ -->
  <!-- Меняйте x1, x2 (координаты концов), stroke, stroke-width, opacity -->
  <line x1="260" y1="10" x2="420" y2="10" stroke="#a5b4fc" stroke-width="0.8" opacity="0.4"/>

  <!-- ============ ЗАГОЛОВОК ТЕХНОЛОГИЙ ============ -->
  <!-- Меняйте текст, letter-spacing, font-size, fill -->
  <text x="340" y="34" text-anchor="middle" font-family="Arial Narrow" font-size="16" font-weight="bold" fill="#a5b4fc" letter-spacing="0" filter="url(#glow)">✦  TECH STACK  ✦</text>

</svg>
